<router-outlet/>

<!-- Sin señal: la app abre, pero no puede guardar ni traer datos nuevos -->
@if (!pwa.enLinea()) {
  <div role="status" class="fixed inset-x-0 top-0 z-[95] bg-orange-500 px-4 pt-[max(0.375rem,env(safe-area-inset-top))] pb-1.5 text-center text-xs font-semibold text-white print:hidden">
    Sin conexión: no se pueden guardar préstamos ni cambios hasta que regrese la señal.
  </div>
}

<!-- Versión nueva publicada: se actualiza cuando el usuario quiera (no se pierde lo que esté capturando) -->
@if (pwa.versionNueva()) {
  <div role="status" class="fixed inset-x-3 bottom-[max(1rem,env(safe-area-inset-bottom))] z-[90] mx-auto flex max-w-md items-center gap-3 rounded-2xl bg-black px-4 py-3 text-sm text-white shadow-2xl print:hidden">
    <span class="size-2 shrink-0 rounded-full bg-emerald-400"></span>
    <span class="flex-1">Hay una versión nueva de la app.</span>
    <button type="button" (click)="pwa.actualizar()" class="h-9 shrink-0 rounded-lg bg-blue-600 px-3 font-semibold hover:bg-blue-700">Actualizar</button>
    <button type="button" (click)="pwa.versionNueva.set(false)" aria-label="Después" class="shrink-0 text-white/60 hover:text-white">✕</button>
  </div>
}

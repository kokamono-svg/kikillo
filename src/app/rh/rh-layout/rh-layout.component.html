<!-- Marco del módulo de Recursos Humanos -->
<section class="min-h-screen bg-slate-100 text-slate-800 print:bg-white">
  <!-- Barra superior negra con el nombre del módulo -->
  <header class="bg-slate-900 text-white print:hidden">
    <div class="mx-auto max-w-6xl px-4 pt-5 md:px-8">
      <p class="text-xs font-semibold uppercase tracking-widest text-orange-400">IMHOTEP · Control de almacenes</p>
      <h1 class="mt-1 text-2xl font-bold tracking-tight">Recursos Humanos</h1>

      <!-- Pestañas. routerLinkActive pone las clases cuando la ruta está activa -->
      <nav class="-mb-px mt-4 flex gap-1 overflow-x-auto">
        @for (p of pestanas; track p.ruta) {
          <a [routerLink]="p.ruta"
            routerLinkActive="!bg-slate-100 !text-slate-900"
            class="whitespace-nowrap rounded-t-xl px-5 py-2.5 text-sm font-semibold text-slate-300 transition hover:text-white">
            {{ p.texto }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 md:px-8 md:py-8 print:p-0">
    <router-outlet />
  </main>
</section>

<!-- Buscador reutilizable de trabajadores -->
<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6 print:hidden">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500">{{ titulo() }}</h2>

  <form class="mt-3 flex flex-col gap-3 sm:flex-row" (ngSubmit)="buscar()">
    <div class="relative flex-1">
      <svg class="pointer-events-none absolute left-3.5 top-1/2 size-5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
      <input type="text" name="termino" [(ngModel)]="termino" autocomplete="off"
        placeholder="Número de empleado, nombre o CURP"
        class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-11 pr-4 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-700 focus:ring-4 focus:ring-blue-700/10" />
    </div>
    <button type="submit" [disabled]="buscando()"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-700 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 disabled:opacity-60 sm:w-40">
      @if (buscando()) {
        <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" /><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z" /></svg>
        Buscando
      } @else { Buscar }
    </button>
  </form>

  @if (mensaje()) {
    <p class="mt-3 text-sm text-slate-500">{{ mensaje() }}</p>
  }

  @if (resultados().length > 1) {
    <ul class="mt-3 divide-y divide-slate-100 overflow-hidden rounded-xl border border-slate-200">
      @for (t of resultados(); track t.id) {
        <li>
          <button type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-slate-50" (click)="elegir(t)">
            <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-slate-900 text-xs font-semibold text-white">{{ iniciales(t) }}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-medium text-slate-900">{{ nombreCompleto(t) }}</span>
              <span class="block text-xs text-slate-500">{{ t.numeroEmpleado }} · {{ t.area }}{{ t.activo ? '' : ' · Baja' }}</span>
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>

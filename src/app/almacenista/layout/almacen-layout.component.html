<!-- =====================================================
     MÓDULO DE ALMACÉN · usa el marco común del dashboard.
     Arriba: selector de almacén (admin y compras) o el
     almacén asignado (almacenista).
====================================================== -->
<app-panel-layout modulo="almacen" titulo="Almacén" [menu]="menu()" [etiqueta]="acceso.etiquetaRol()">
  <div encabezado class="flex min-w-0 flex-1 items-center gap-3">
    <!-- Almacén que se está viendo -->
    @if (acceso.veTodos()) {
      <label class="relative min-w-0 max-w-xs flex-1">
        <span class="sr-only">Almacén</span>
        <svg
          class="pointer-events-none absolute top-1/2 left-3 size-5 -translate-y-1/2 text-gray-400"
          fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z" />
        </svg>
        <select
          [value]="acceso.actual()"
          (change)="acceso.elegir(valor($event))"
          class="h-10 w-full cursor-pointer appearance-none truncate rounded-xl border border-gray-200 bg-gray-50 pr-9 pl-10 text-sm font-medium text-gray-800 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/15 dark:border-white/10 dark:bg-white/5 dark:text-white dark:focus:bg-neutral-900"
        >
          <option value="">Todos los almacenes</option>
          @for (a of acceso.almacenes(); track a) {
            <option [value]="a">{{ a }}</option>
          }
        </select>
        <svg
          class="pointer-events-none absolute top-1/2 right-3 size-4 -translate-y-1/2 text-gray-400"
          fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </label>
    } @else {
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-gray-900 dark:text-white">
          {{ acceso.actual() || 'Sin almacén asignado' }}
        </p>
        <p class="truncate text-xs text-gray-500 dark:text-gray-400">Tu almacén</p>
      </div>
    }

    @if (!acceso.puedePrestar()) {
      <span
        class="ml-auto hidden shrink-0 rounded-full bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-600 sm:inline-flex dark:bg-white/10 dark:text-gray-300"
        >Solo consulta</span
      >
    }
  </div>

  <router-outlet />
</app-panel-layout>

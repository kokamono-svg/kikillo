===== Login Wrapper =====
<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-gray-100 via-white to-brand-50 p-4 dark:from-gray-950 dark:via-gray-900 dark:to-gray-950">

  <div class="card w-full max-w-4xl rounded-3xl border border-gray-200/70 bg-white shadow-2xl shadow-brand-500/10 backdrop-blur dark:border-gray-800 dark:bg-gray-900">

    <div class="card-body flex flex-col lg:flex-row">
    <!-- =========================
         FORMULARIO
    ========================== -->
    <div class="flex w-full flex-1 items-center justify-center px-4 py-8 sm:px-6 lg:w-1/2 lg:px-10">
      <div class="w-full max-w-md">
        <!-- Encabezado -->
        <div class="mb-8 text-center lg:text-left">
          <h1 class="text-2xl font-bold tracking-tight text-gray-800 dark:text-white sm:text-3xl">
            Iniciar sesión
          </h1>

          <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
            Introduzca sus datos para continuar
          </p>
        </div>

        <div class="group relative mb-6 overflow-hidden rounded-2xl bg-brand-950 p-4 shadow-lg ring-1 ring-brand-500/30 lg:flex">
          <div class="flex justify-center items-center w-full">
            <img
              src="images/logo.jpg"
              alt="Logo Imhotep"
              class="h-auto w-48 rounded-xl object-contain drop-shadow-[0_8px_20px_rgba(0,0,0,0.35)] transition duration-500 ease-out group-hover:scale-105 sm:w-64 md:w-80 lg:w-96"
            />
          </div>
        </div>
        <!-- Formulario -->
        <form>
          <div class="space-y-5">
            <!-- Usuario -->
            <div>
              <label
                for="email"
                class="mb-1.5 block text-sm font-semibold text-gray-700 dark:text-gray-300"
              >
                Usuario
                <span class="text-error-500">*</span>
              </label>

              <input
                type="text"
                id="email"
                name="email"
                placeholder="Número de Seguridad Social"
                class="h-12 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 shadow-sm outline-none transition duration-200 hover:border-gray-400 focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder:text-white/30 dark:hover:border-gray-600 dark:focus:border-brand-800"
              />
            </div>

            <!-- Contraseña -->
            <div>
              <label
                for="password"
                class="mb-1.5 block text-sm font-semibold text-gray-700 dark:text-gray-300"
              >
                Contraseña
                <span class="text-error-500">*</span>
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Introduzca su contraseña"
                  class="h-12 w-full rounded-xl border border-gray-300 bg-gray-50 py-2.5 pl-4 pr-11 text-sm text-gray-800 placeholder:text-gray-400 shadow-sm outline-none transition duration-200 hover:border-gray-400 focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder:text-white/30 dark:hover:border-gray-600 dark:focus:border-brand-800"
                />

                <!-- Icono -->
              </div>
            </div>

            <!-- Botón -->
            <div class="pt-2">
              <a
              href="/dashboard"

                class="btn btn-info h-12 w-full rounded-xl border-0 text-sm font-semibold shadow-lg shadow-sky-500/30 transition duration-300 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-sky-500/40 active:translate-y-0"
              >
                Iniciar sesión
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>


  </div>


</div>
</div>
